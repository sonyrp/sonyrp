<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#302b63"/>
      <stop offset="1" stop-color="#5b3fc4"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.6" stop-color="#7f5af0"/>
      <stop offset="1" stop-color="#2a1f6b"/>
    </radialGradient>
    <style>
      .s{fill:#fff;animation:tw 3s ease-in-out infinite}
      .s2{animation-delay:1s}.s3{animation-delay:2s}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      .orbit{transform-origin:1030px 120px;animation:rot 14s linear infinite}
      @keyframes rot{to{transform:rotate(360deg)}}
      .fade{animation:fi 1.6s ease-out both}
      .fade2{animation:fi 1.6s ease-out .6s both}
      @keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      .shoot{animation:sh 7s linear infinite}
      @keyframes sh{0%{transform:translate(0,0);opacity:0}3%{opacity:1}12%{transform:translate(-260px,130px);opacity:0}100%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- stars -->
  <g>
    <circle class="s" cx="60" cy="40" r="1.6"/><circle class="s s2" cx="140" cy="210" r="1.2"/>
    <circle class="s s3" cx="230" cy="70" r="1.8"/><circle class="s" cx="320" cy="250" r="1.1"/>
    <circle class="s s2" cx="410" cy="30" r="1.4"/><circle class="s s3" cx="480" cy="190" r="1"/>
    <circle class="s" cx="560" cy="60" r="1.3"/><circle class="s s2" cx="650" cy="270" r="1.6"/>
    <circle class="s s3" cx="720" cy="35" r="1.1"/><circle class="s" cx="800" cy="230" r="1.5"/>
    <circle class="s s2" cx="880" cy="50" r="1.2"/><circle class="s s3" cx="940" cy="260" r="1.4"/>
    <circle class="s" cx="1120" cy="40" r="1.7"/><circle class="s s2" cx="1160" cy="230" r="1.2"/>
    <circle class="s s3" cx="100" cy="130" r="1"/><circle class="s" cx="1080" cy="280" r="1.1"/>
    <circle class="s s2" cx="20" cy="270" r="1.3"/><circle class="s s3" cx="600" cy="140" r="0.9"/>
  </g>

  <!-- shooting star -->
  <g class="shoot"><line x1="900" y1="20" x2="960" y2="-10" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".9"/></g>

  <!-- ringed planet with moon -->
  <ellipse cx="1030" cy="120" rx="95" ry="22" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="1030" cy="120" r="48" fill="url(#planet)"/>
  <path d="M935 120 a95 22 0 0 0 190 0" fill="none" stroke="#c4b5fd" stroke-width="2.5"/>
  <g class="orbit"><circle cx="1030" cy="45" r="6" fill="#fff"/></g>

  <!-- atom (physics engineering) -->
  <g transform="translate(150 120)" fill="none" stroke="#a78bfa" stroke-width="1.6" opacity=".7">
    <ellipse rx="34" ry="12"/>
    <ellipse rx="34" ry="12" transform="rotate(60)"/>
    <ellipse rx="34" ry="12" transform="rotate(-60)"/>
    <circle r="4" fill="#c4b5fd" stroke="none"/>
  </g>

  <text class="fade" x="600" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#txt)">Sonia Restrepo</text>
  <text class="fade2" x="600" y="200" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#c4b5fd" letter-spacing="2">DATA &amp; AI ENGINEER  ✦  PHYSICS ENGINEER  ✦  R&amp;D&amp;I</text>
</svg>
