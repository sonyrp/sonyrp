<svg xmlns="http://www.w3.org/2000/svg" width="440" height="630" viewBox="-10 -6 440 630">
  <defs>
    <radialGradient id="parch" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#f6e7c1"/>
      <stop offset="0.7" stop-color="#e9cf95"/>
      <stop offset="1" stop-color="#b98f4e"/>
    </radialGradient>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="4" seed="3"/>
      <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .30  0 0 0 0 .12  0 0 0 .6 -.14"/>
    </filter>
    <clipPath id="sheet"><rect x="14" y="20" width="392" height="580" rx="6"/></clipPath>
    <clipPath id="photo"><rect x="50" y="138" width="320" height="248"/></clipPath>
    <style>
      text{font-family:Georgia,'Times New Roman',serif;fill:#3b2a1a;font-weight:700}
      .poster{animation:sway 6s ease-in-out infinite;transform-origin:210px 14px}
      @keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
      .berry{animation:bl 2.4s ease-in-out infinite}
      @keyframes bl{0%,100%{fill:#3b2a1a}50%{fill:#a12a1e}}
    </style>
  </defs>

  <g class="poster">
    <rect x="14" y="20" width="392" height="580" rx="6" fill="url(#parch)" stroke="#6b4a22" stroke-width="2.5"/>
    <g clip-path="url(#sheet)"><rect width="420" height="610" filter="url(#paper)"/></g>

    <text x="210" y="116" text-anchor="middle" font-size="92" textLength="324" lengthAdjust="spacingAndGlyphs">WANTED</text>

    <!-- portrait -->
    <rect x="50" y="138" width="320" height="248" fill="#5d7340"/>
    <g clip-path="url(#photo)">
      <image x="50" y="118" width="320" height="320" preserveAspectRatio="xMidYMid slice" style="image-rendering:pixelated" href="data:image/jpeg;base64,"/>
      <rect x="50" y="138" width="320" height="248" fill="#c9a36a" opacity=".12"/>
    </g>
    <rect x="50" y="138" width="320" height="248" fill="none" stroke="#3b2a1a" stroke-width="4"/>

    <text x="210" y="428" text-anchor="middle" font-size="34" letter-spacing="3" textLength="310" lengthAdjust="spacingAndGlyphs">ONLY ALIVE</text>
    <text x="210" y="456" text-anchor="middle" font-size="15" font-style="italic" letter-spacing="2">"THE DATA NAVIGATOR"</text>
    <text x="210" y="502" text-anchor="middle" font-size="42" textLength="320" lengthAdjust="spacingAndGlyphs">SONIA RESTREPO</text>

    <!-- bounty -->
    <text class="berry" x="210" y="552" text-anchor="middle" font-size="38" textLength="312" lengthAdjust="spacingAndGlyphs">฿ 3,000,000,000-</text>

    <path d="M50 566 H370" stroke="#3b2a1a" stroke-width="1.5"/>
    <text x="52" y="586" font-size="10" font-weight="400" letter-spacing=".8">CRIMES: AUTOMATING THE BORING</text>
    <text x="368" y="586" text-anchor="end" font-size="13" letter-spacing="3">R&amp;D&amp;I</text>
  </g>

  <!-- nail -->
  <circle cx="210" cy="16" r="6" fill="#6b6b6b" stroke="#2b2b2b" stroke-width="1.5"/>
  <circle cx="208" cy="14" r="1.8" fill="#cfcfcf"/>
</svg>
