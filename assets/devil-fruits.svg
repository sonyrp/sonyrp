<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d33"/><stop offset="1" stop-color="#12355b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="0.45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </radialGradient>
    <!-- the tell-tale swirls -->
    <g id="sw" fill="none" stroke-width="2.6" stroke-linecap="round">
      <path d="M-28 -20 a4 4 0 1 1 8 0 a8 8 0 1 1 -16 0"/>
      <path d="M8 -30 a4 4 0 1 1 8 0 a8 8 0 1 1 -16 0"/>
      <path d="M30 -4 a4 4 0 1 1 8 0 a8 8 0 1 1 -16 0"/>
      <path d="M-8 2 a4 4 0 1 1 8 0 a8 8 0 1 1 -16 0"/>
      <path d="M-36 14 a4 4 0 1 1 8 0 a8 8 0 1 1 -16 0"/>
      <path d="M14 26 a4 4 0 1 1 8 0 a8 8 0 1 1 -16 0"/>
      <path d="M-14 34 a4 4 0 1 1 8 0 a8 8 0 1 1 -16 0"/>
      <path d="M44 22 a4 4 0 1 1 8 0 a8 8 0 1 1 -16 0"/>
      <path d="M-48 -8 a4 4 0 1 1 8 0 a8 8 0 1 1 -16 0"/>
    </g>
    <g id="stem">
      <path d="M0 0 q-2 -16 8 -22 q12 -6 14 4 q0 8 -8 6 q-5 -2 -2 -6" fill="none" stroke="#3f7d3a" stroke-width="5" stroke-linecap="round"/>
      <path d="M-2 -6 q-20 -12 -30 2 q16 10 30 -2 Z" fill="#57a64a" stroke="#2f5f2c" stroke-width="1.5"/>
    </g>
    <path id="s1" d="M0 -48 C34 -48 54 -24 54 4 C54 34 30 50 0 50 C-30 50 -54 34 -54 4 C-54 -24 -34 -48 0 -48 Z"/>
    <path id="s2" d="M0 -50 C20 -50 26 -30 30 -12 C36 8 48 16 46 34 C42 52 16 54 0 54 C-16 54 -42 52 -46 34 C-48 16 -36 8 -30 -12 C-26 -30 -20 -50 0 -50 Z"/>
    <path id="s3" d="M0 -40 C40 -44 62 -22 62 6 C62 34 36 48 0 48 C-36 48 -62 34 -62 6 C-62 -22 -40 -44 0 -40 Z"/>
    <path id="s4" d="M0 -30 C10 -54 54 -50 54 -14 C54 18 20 38 0 54 C-20 38 -54 18 -54 -14 C-54 -50 -10 -54 0 -30 Z"/>
    <clipPath id="c1"><use href="#s1"/></clipPath>
    <clipPath id="c2"><use href="#s2"/></clipPath>
    <clipPath id="c3"><use href="#s3"/></clipPath>
    <clipPath id="c4"><use href="#s4"/></clipPath>
    <clipPath id="frame"><rect width="1200" height="330" rx="14"/></clipPath>
    <style>
      text{font-family:Georgia,'Times New Roman',serif;text-anchor:middle}
      .n{font-size:24px;font-weight:700;fill:#f4c430}
      .d{font-size:15px;fill:#f1dfb5}
      .j{font-size:12px;font-style:italic;fill:#9fb3c8;letter-spacing:2px}
      .f{animation:fl 4s ease-in-out infinite}
      .f2{animation-delay:-1s}.f3{animation-delay:-2s}.f4{animation-delay:-3s}
      @keyframes fl{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
      .g{animation:gp 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes gp{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.15);opacity:1}}
      .sp{animation:sk 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .sp2{animation-delay:.8s}.sp3{animation-delay:1.6s}
      @keyframes sk{0%,100%{transform:scale(0) rotate(0)}50%{transform:scale(1) rotate(90deg)}}
      .sh{animation:shd 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes shd{0%,100%{transform:scaleX(1);opacity:.4}50%{transform:scaleX(.7);opacity:.2}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect x="1" y="1" width="1198" height="328" rx="14" fill="none" stroke="#f4c430" stroke-opacity=".35" stroke-width="2"/>

    <!-- 1 · Ai-Ai no Mi -->
    <g transform="translate(150 120)">
      <circle class="g" r="88" fill="url(#glow)"/>
      <ellipse class="sh" cy="84" rx="44" ry="7" fill="#000"/>
      <g class="f">
        <use href="#s1" fill="#8e44ad"/>
        <use href="#sw" stroke="#5b2a86" clip-path="url(#c1)"/>
        <use href="#s1" fill="url(#shade)"/>
        <use href="#s1" fill="none" stroke="#3d1a5c" stroke-width="2.5"/>
        <use href="#stem" y="-46"/>
      </g>
      <path class="sp" d="M70 -56 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 Z" fill="#fff8e1"/>
      <path class="sp sp2" d="M-76 -20 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z" fill="#fff8e1"/>
      <text class="n" y="120">Ai-Ai no Mi</text>
      <text class="j" y="140">APPLIED AI</text>
      <text class="d" y="164">Integrating AI into</text>
      <text class="d" y="184">real business processes</text>
    </g>

    <!-- 2 · Data-Data no Mi -->
    <g transform="translate(450 120)">
      <circle class="g" r="88" fill="url(#glow)" style="animation-delay:-1s"/>
      <ellipse class="sh" cy="84" rx="44" ry="7" fill="#000" style="animation-delay:-1s"/>
      <g class="f f2">
        <use href="#s2" fill="#1b8fd6"/>
        <use href="#sw" stroke="#0f5a8c" clip-path="url(#c2)"/>
        <use href="#s2" fill="url(#shade)"/>
        <use href="#s2" fill="none" stroke="#0a3a5c" stroke-width="2.5"/>
        <use href="#stem" y="-48"/>
      </g>
      <path class="sp sp2" d="M66 -40 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 Z" fill="#fff8e1"/>
      <path class="sp sp3" d="M-70 10 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z" fill="#fff8e1"/>
      <text class="n" y="120">Data-Data no Mi</text>
      <text class="j" y="140">DATA ENGINEERING</text>
      <text class="d" y="164">Designing data architectures</text>
      <text class="d" y="184">and pipelines</text>
    </g>

    <!-- 3 · Auto-Auto no Mi -->
    <g transform="translate(750 120)">
      <circle class="g" r="88" fill="url(#glow)" style="animation-delay:-2s"/>
      <ellipse class="sh" cy="84" rx="50" ry="7" fill="#000" style="animation-delay:-2s"/>
      <g class="f f3">
        <use href="#s3" fill="#e67e22"/>
        <use href="#sw" stroke="#a84e0c" clip-path="url(#c3)"/>
        <use href="#s3" fill="url(#shade)"/>
        <use href="#s3" fill="none" stroke="#6e3206" stroke-width="2.5"/>
        <use href="#stem" y="-40"/>
      </g>
      <path class="sp sp3" d="M76 -30 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 Z" fill="#fff8e1"/>
      <path class="sp" d="M-80 -36 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z" fill="#fff8e1"/>
      <text class="n" y="120">Auto-Auto no Mi</text>
      <text class="j" y="140">AUTOMATION</text>
      <text class="d" y="164">Eliminating manual,</text>
      <text class="d" y="184">repetitive tasks</text>
    </g>

    <!-- 4 · Vibe-Vibe no Mi -->
    <g transform="translate(1050 120)">
      <circle class="g" r="88" fill="url(#glow)" style="animation-delay:-3s"/>
      <ellipse class="sh" cy="84" rx="44" ry="7" fill="#000" style="animation-delay:-3s"/>
      <g class="f f4">
        <use href="#s4" fill="#e63973"/>
        <use href="#sw" stroke="#9c1f4a" clip-path="url(#c4)"/>
        <use href="#s4" fill="url(#shade)"/>
        <use href="#s4" fill="none" stroke="#66102e" stroke-width="2.5"/>
        <use href="#stem" y="-32"/>
      </g>
      <path class="sp" d="M72 -50 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 Z" fill="#fff8e1"/>
      <path class="sp sp2" d="M-74 0 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z" fill="#fff8e1"/>
      <text class="n" y="120">Vibe-Vibe no Mi</text>
      <text class="j" y="140">VIBECODING</text>
      <text class="d" y="164">Prototypes at the speed of</text>
      <text class="d" y="184">an idea, coding alongside AI</text>
    </g>
  </g>
</svg>
