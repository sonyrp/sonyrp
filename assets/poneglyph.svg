<text class="r" x="524" y="60" font-size="13" font-weight="700" fill="#f4c430" letter-spacing="5">TRANSLATED FROM THE PONEGLYPH OF R&amp;D&amp;I</text>
<text class="r r2" x="524" y="110" font-size="32" font-style="italic" fill="#fff8e1">“When do you think people die?</text>
