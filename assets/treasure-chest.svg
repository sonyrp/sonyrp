<rect x="186" y="150" width="28" height="30" rx="5" fill="#f2c14e" stroke="#2b1a0c" stroke-width="2"/><circle cx="200" cy="162" r="4" fill="#2b1a0c"/><path d="M200 162 v10" stroke="#2b1a0c" stroke-width="3"/>
<ellipse cx="200" cy="236" rx="100" ry="8" fill="#3b2a1a" opacity=".25"/>
<path class="tw" d="M300 100 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 Z" fill="#ff9f1c"/>
<path class="tw" style="animation-delay:.9s" d="M96 120 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z" fill="#ff9f1c"/>
<text x="350" y="70" font-size="14" font-weight="700" fill="#a12a1e" letter-spacing="6">TREASURE Nº 1</text>
<text x="350" y="122" font-size="40" text-anchor="start" font-weight="900" style="font-family:'Arial Black',Impact,'Segoe UI Black','Helvetica Neue',Arial,sans-serif" stroke-linejoin="round"  fill="#3b2a1a" stroke="#3b2a1a" stroke-width="10.4">phishing-detector</text><text x="350" y="122" font-size="40" text-anchor="start" font-weight="900" style="font-family:'Arial Black',Impact,'Segoe UI Black','Helvetica Neue',Arial,sans-serif" stroke-linejoin="round"  fill="#fff8e1" stroke="#fff8e1" stroke-width="4.8">phishing-detector</text><text x="350" y="122" font-size="40" text-anchor="start" font-weight="900" style="font-family:'Arial Black',Impact,'Segoe UI Black','Helvetica Neue',Arial,sans-serif" stroke-linejoin="round"  fill="#e63946">phishing-detector</text>
<text x="350" y="160" font-size="18" fill="#3b2a1a">Hunts phishing emails and messages across the seas</text>
<text x="350" y="184" font-size="18" fill="#3b2a1a">using <tspan font-weight="700">NLP</tspan> and <tspan font-weight="700">Machine Learning</tspan>.</text>
