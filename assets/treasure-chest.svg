<rect x="15" y="15" width="1170" height="230" rx="5" fill="none" stroke="#3b2a1a" stroke-opacity=".45" stroke-width="1.2"/>
<g fill="#f2c14e" stroke="#3b2a1a" stroke-width="1"><circle cx="8" cy="8" r="3.5"/><circle cx="1192" cy="8" r="3.5"/><circle cx="8" cy="252" r="3.5"/><circle cx="1192" cy="252" r="3.5"/></g><g class="glow"><g class="rays" fill="#ffd23f" opacity=".45"><path d="M200 150 L190 20 L210 20 Z" transform="rotate(-80 200 150)"/><path d="M200 150 L190 20 L210 20 Z" transform="rotate(-60 200 150)"/><path d="M200 150 L190 20 L210 20 Z" transform="rotate(-40 200 150)"/><path d="M200 150 L190 20 L210 20 Z" transform="rotate(-20 200 150)"/><path d="M200 150 L190 20 L210 20 Z" transform="rotate(0 200 150)"/><path d="M200 150 L190 20 L210 20 Z" transform="rotate(20 200 150)"/><path d="M200 150 L190 20 L210 20 Z" transform="rotate(40 200 150)"/><path d="M200 150 L190 20 L210 20 Z" transform="rotate(60 200 150)"/><path d="M200 150 L190 20 L210 20 Z" transform="rotate(80 200 150)"/></g>
<ellipse cx="200" cy="150" rx="84" ry="26" fill="#fff3b0"/></g>
<g class="coin" style="animation-delay:0s"><circle cx="160" cy="150" r="9" fill="#ffd23f" stroke="#3b2a1a" stroke-width="1.5"/><text x="160" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5a12">฿</text></g><g class="coin" style="animation-delay:0.25s"><circle cx="200" cy="150" r="9" fill="#ffd23f" stroke="#3b2a1a" stroke-width="1.5"/><text x="200" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5a12">฿</text></g><g class="coin" style="animation-delay:0.5s"><circle cx="240" cy="150" r="9" fill="#ffd23f" stroke="#3b2a1a" stroke-width="1.5"/><text x="240" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5a12">฿</text></g><g class="coin" style="animation-delay:0.7s"><circle cx="180" cy="150" r="9" fill="#ffd23f" stroke="#3b2a1a" stroke-width="1.5"/><text x="180" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5a12">฿</text></g><g class="coin" style="animation-delay:0.9s"><circle cx="222" cy="150" r="9" fill="#ffd23f" stroke="#3b2a1a" stroke-width="1.5"/><text x="222" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5a12">฿</text></g>
