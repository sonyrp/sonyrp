<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d33"/><stop offset="1" stop-color="#12355b"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="250" rx="14"/></clipPath>
    <style>
      text{font-family:Georgia,'Times New Roman',serif}
      .mono{font-family:Consolas,'Courier New',monospace}
      .snail{animation:ring .5s ease-in-out infinite;transform-origin:250px 190px}
      @keyframes ring{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
      .eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
      @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
      .arc{animation:snd 1.5s ease-out infinite}
      .a2{animation-delay:.25s}.a3{animation-delay:.5s}
      @keyframes snd{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
      .pu{animation:puru 3s steps(1) infinite;opacity:0}
      .p2{animation-delay:.5s}.p3{animation-delay:1s}.p4{animation-delay:1.5s}
      @keyframes puru{0%{opacity:1}75%{opacity:1}76%,100%{opacity:0}}
      .shake{animation:sh .25s linear infinite}
      @keyframes sh{0%,100%{transform:translate(0,0)}25%{transform:translate(1px,-1px)}75%{transform:translate(-1px,1px)}}
      .btn{animation:glow 2s ease-in-out infinite}
      @keyframes glow{0%,100%{stroke-opacity:.4}50%{stroke-opacity:1}}
      .rx{animation:bobr 1s ease-in-out infinite}
      @keyframes bobr{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="250" fill="url(#bg)"/>
    <rect x="1" y="1" width="1198" height="248" rx="14" fill="none" stroke="#f4c430" stroke-opacity=".35" stroke-width="2"/>

    <ellipse cx="250" cy="206" rx="170" ry="12" fill="#000" opacity=".3"/>

    <!-- sound waves -->
    <g fill="none" stroke="#f4c430" stroke-width="4" stroke-linecap="round">
      <path class="arc" d="M82 96 q-14 22 0 44"/>
      <path class="arc a2" d="M62 82 q-24 36 0 72"/>
      <path class="arc a3" d="M42 68 q-34 50 0 100"/>
    </g>

    <g class="snail">
      <!-- body -->
      <path d="M110 196 Q92 150 130 140 Q170 132 210 160 L360 170 Q410 176 404 196 Q300 208 110 196 Z" fill="#f6d89a" stroke="#3b2a1a" stroke-width="3"/>
      <!-- eye stalks -->
      <path d="M128 146 Q112 110 116 82 M160 142 Q164 106 176 80" fill="none" stroke="#f6d89a" stroke-width="13" stroke-linecap="round"/>
      <path d="M121 146 Q106 112 109 84 M135 142 Q120 110 123 84 M153 142 Q158 106 169 80 M167 144 Q171 110 183 84" fill="none" stroke="#3b2a1a" stroke-width="2.5"/>
      <g class="eye"><circle cx="114" cy="72" r="19" fill="#fff" stroke="#3b2a1a" stroke-width="3"/><circle cx="110" cy="72" r="6" fill="#3b2a1a"/></g>
      <g class="eye"><circle cx="180" cy="68" r="19" fill="#fff" stroke="#3b2a1a" stroke-width="3"/><circle cx="176" cy="68" r="6" fill="#3b2a1a"/></g>
      <!-- sleepy smile -->
      <path d="M112 170 q18 12 36 0" fill="none" stroke="#3b2a1a" stroke-width="3" stroke-linecap="round"/>
      <!-- shell -->
      <circle cx="290" cy="124" r="70" fill="#c0392b" stroke="#3b2a1a" stroke-width="3"/>
      <path d="M290 124 m-4 0 a4 4 0 1 1 8 0 a12 12 0 1 1 -24 0 a22 22 0 1 1 44 0 a34 34 0 1 1 -68 0 a48 48 0 1 1 96 0" fill="none" stroke="#7d2f1f" stroke-width="5" stroke-linecap="round"/>
      <path d="M244 82 q18 -22 46 -24" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".35"/>
      <!-- receiver -->
      <g class="rx">
        <path d="M232 50 q58 -36 116 0 l-12 16 q-8 -12 -20 -8 l-8 6 q-18 -8 -36 0 l-8 -6 q-12 -4 -20 8 Z" fill="#1c1c1c" stroke="#000" stroke-width="2"/>
        <path d="M250 46 q40 -22 80 0" fill="none" stroke="#555" stroke-width="2"/>
      </g>
      <path d="M344 62 q20 10 8 24 q-12 12 4 22 q14 10 2 22 q-10 10 6 22" fill="none" stroke="#1c1c1c" stroke-width="3.5" stroke-linecap="round"/>
      <!-- dial -->
      <circle cx="290" cy="124" r="13" fill="#f6d89a" stroke="#3b2a1a" stroke-width="2.5"/>
      <circle cx="290" cy="124" r="4" fill="#3b2a1a"/>
    </g>

    <!-- ringing -->
    <g class="shake" font-size="34" font-weight="700" fill="#f4c430" font-style="italic">
      <text class="pu" x="470" y="76">puru</text>
      <text class="pu p2" x="570" y="76">puru</text>
      <text class="pu p3" x="670" y="76">puru</text>
      <text class="pu p4" x="770" y="76">puru...</text>
    </g>
    <text x="470" y="124" font-size="28" font-weight="700" fill="#fff8e1">Got a quest for my crew?</text>
    <text x="470" y="154" font-size="18" font-style="italic" fill="#f1dfb5">Pick up the Den Den Mushi, I always answer a fellow nakama.</text>
    <rect class="btn" x="470" y="174" width="420" height="42" rx="21" fill="#0A66C2" stroke="#f4c430" stroke-width="3"/>
    <text class="mono" x="680" y="201" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">linkedin.com/in/sonia-restrepo-perez</text>
    <text x="910" y="201" font-size="14" font-style="italic" fill="#9fb3c8">click to call ⟶</text>
  </g>
</svg>
