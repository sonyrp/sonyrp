<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b3fc4"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#0f0c29"/>
    </linearGradient>
    <style>
      .s{fill:#fff;animation:tw 3s ease-in-out infinite}.s2{animation-delay:1.5s}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      .cur{animation:bl 1s steps(1) infinite}
      @keyframes bl{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="120" fill="url(#bg)"/>
  <circle class="s" cx="80" cy="30" r="1.4"/><circle class="s s2" cx="260" cy="90" r="1.2"/>
  <circle class="s" cx="940" cy="25" r="1.5"/><circle class="s s2" cx="1110" cy="85" r="1.2"/>
  <circle class="s s2" cx="420" cy="20" r="1"/><circle class="s" cx="780" cy="100" r="1.1"/>
  <text x="600" y="68" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#e9e3ff">&gt; end of transmission. see you in another galaxy <tspan class="cur" fill="#a78bfa">█</tspan></text>
</svg>
