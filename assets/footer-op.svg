<path d="M0 0 V-42" stroke="#2b1a0c" stroke-width="2.2"/>
<path d="M2 -38 q20 8 17 32 h-17 Z M-2 -32 q-15 6 -14 26 h14 Z" fill="#fffaf0" stroke="#2b1a0c" stroke-width="1.2"/>
<path d="M0 -42 h13 l-3 4 l3 4 h-13 Z" fill="#111"/></g></g></g></g>
<g class="w1"><path d="M0 142 q50 -14 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V170 H0 Z" fill="#0e7c96" /></g>
</g>
