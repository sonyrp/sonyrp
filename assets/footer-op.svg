<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170">
<style>text{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}
.w1{animation:wv 7s linear infinite}.w2{animation:wv 11s linear infinite reverse}
@keyframes wv{to{transform:translateX(-200px)}}
.sail{animation:go 38s linear -9s infinite}
@keyframes go{from{transform:translateX(-80px)}to{transform:translateX(1290px)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3px) rotate(3deg)}}
.rays{animation:spin 40s linear infinite;transform-origin:600px 124px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a3c"/><stop offset=".7" stop-color="#ffd166"/><stop offset="1" stop-color="#fff1b8"/></linearGradient>
<clipPath id="frame"><rect width="1200" height="170" rx="14"/></clipPath></defs>
<g clip-path="url(#frame)">
<rect width="1200" height="170" fill="url(#sky)"/>
<g class="rays" fill="#fff" opacity=".22"><path d="M600 -40 l16 164 h-32 Z" transform="rotate(0 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(20 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(40 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(60 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(80 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(100 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(120 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(140 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(160 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(180 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(200 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(220 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(240 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(260 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(280 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(300 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(320 600 124)"/><path d="M600 -40 l16 164 h-32 Z" transform="rotate(340 600 124)"/></g>
<circle cx="600" cy="124" r="58" fill="#e63946" stroke="#3b2a1a" stroke-width="2.5"/>
<text x="600" y="62" font-size="32" text-anchor="middle" font-weight="900" style="font-family:'Arial Black',Impact,'Segoe UI Black','Helvetica Neue',Arial,sans-serif" stroke-linejoin="round"  fill="#3b2a1a" stroke="#3b2a1a" stroke-width="8.3">THE VOYAGE CONTINUES...</text><text x="600" y="62" font-size="32" text-anchor="middle" font-weight="900" style="font-family:'Arial Black',Impact,'Segoe UI Black','Helvetica Neue',Arial,sans-serif" stroke-linejoin="round"  fill="#fff8e1" stroke="#fff8e1" stroke-width="3.8">THE VOYAGE CONTINUES...</text><text x="600" y="62" font-size="32" text-anchor="middle" font-weight="900" style="font-family:'Arial Black',Impact,'Segoe UI Black','Helvetica Neue',Arial,sans-serif" stroke-linejoin="round"  fill="#f2c14e">THE VOYAGE CONTINUES...</text>
<text class="mono" x="600" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#3b2a1a" letter-spacing="1.5">see you on the next island, nakama  ✦  thanks for coming aboard</text>
<g class="w2"><path d="M0 122 q50 -12 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V170 H0 Z" fill="#17a2b8" /></g>
