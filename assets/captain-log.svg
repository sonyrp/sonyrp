<svg xmlns="http://www.w3.org/2000/svg" width="600" height="556" viewBox="0 0 600 556">
<style>text{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}
.r{animation:rv 1.2s ease-out backwards}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pulse{animation:pl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,30%,100%{transform:scale(1)}12%{transform:scale(1.14) rotate(-2deg)}}
.flame{animation:fm .45s ease-in-out infinite alternate;transform-origin:40px 500px}
@keyframes fm{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.14) rotate(3deg)}}
.halo{animation:hl 2.2s ease-in-out infinite}
@keyframes hl{0%,100%{opacity:.3}50%{opacity:.6}}
.quill{animation:ql 1.8s ease-in-out infinite;transform-origin:548px 536px}
@keyframes ql{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg) translate(4px,0)}}
.quote{animation:qc 4s ease-in-out infinite}
@keyframes qc{0%,100%{fill:#8f2f17}50%{fill:#b5451f}}
.spk{animation:spk 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spk{0%,100%{transform:scale(0)}50%{transform:scale(1)}}
.twist{animation:tw 1.2s linear infinite}@keyframes tw{to{stroke-dashoffset:-10}}
</style>
<defs>
<linearGradient id="pap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eedca6"/><stop offset=".5" stop-color="#e4cd8e"/><stop offset="1" stop-color="#d6bb76"/></linearGradient>
<pattern id="fibH" width="60" height="5" patternUnits="userSpaceOnUse"><path d="M0 2.500 H60" stroke="#a8823f" stroke-width="1" opacity=".38"/></pattern>
<pattern id="fibV" width="9" height="60" patternUnits="userSpaceOnUse"><path d="M4.500 0 V60" stroke="#a8823f" stroke-width="1.8" opacity=".17"/></pattern>
<filter id="torn" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9"/></filter>
<filter id="stain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .33  0 0 0 0 .1  0 0 0 .75 -.24"/><feComposite operator="in" in2="SourceGraphic"/></filter>
</defs>
<g filter="url(#torn)"><rect x="7" y="7" width="586" height="542" rx="4" fill="url(#pap)" stroke="#8a6a3a" stroke-width="2.500"/>
<rect x="7" y="7" width="586" height="542" rx="4" fill="url(#fibH)"/><rect x="7" y="7" width="586" height="542" rx="4" fill="url(#fibV)"/><rect x="7" y="7" width="586" height="542" rx="4" filter="url(#stain)"/></g>
<path class="spk" style="animation-delay:0s" d="M40 33 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#8a6a3a"/><path class="spk" style="animation-delay:0.9s" d="M560 37 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#8a6a3a"/><path class="spk" style="animation-delay:1.6s" d="M92 183 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#8a6a3a"/><path class="spk" style="animation-delay:0.4s" d="M508 183 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#8a6a3a"/><path class="spk" style="animation-delay:1.2s" d="M566 293 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#8a6a3a"/><path class="spk" style="animation-delay:2s" d="M34 293 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#8a6a3a"/>
<text class="r" x="300" y="38" text-anchor="middle" font-size="12" font-weight="700" fill="#8f2f17" letter-spacing="7">THE LEGEND</text>
<g class="r" style="animation-delay:0.0s"><g class="pulse" style="animation-delay:2.0s"><text x="88" y="78" text-anchor="middle" font-size="23" font-weight="700" fill="#8f2f17" letter-spacing="1.5">DATA.</text></g></g><g class="r" style="animation-delay:0.5s"><g class="pulse" style="animation-delay:2.8s"><text x="248" y="78" text-anchor="middle" font-size="23" font-weight="700" fill="#3b2a1a" letter-spacing="1.5">INSIGHT.</text></g></g><g class="r" style="animation-delay:1.0s"><g class="pulse" style="animation-delay:3.6s"><text x="462" y="78" text-anchor="middle" font-size="23" font-weight="700" fill="#8f2f17" letter-spacing="1.5">AUTOMATION.</text></g></g>
<g class="r" style="animation-delay:1.8s"><text class="" x="300" y="114" text-anchor="middle" font-size="17.5" fill="#3b2a1a" font-style="italic">Legend tells of a treasure hidden at the end of</text></g>
<g class="r" style="animation-delay:1.8s"><text class="" x="300" y="136" text-anchor="middle" font-size="17.5" fill="#3b2a1a" font-style="italic">the Grand Line of Data: a world where machines do</text></g>
<g class="r" style="animation-delay:1.8s"><text class="" x="300" y="158" text-anchor="middle" font-size="17.5" fill="#3b2a1a" font-style="italic">the boring work and people are free to create.</text></g>
<g class="r" style="animation-delay:2.8s"><text class="quote" x="300" y="196" text-anchor="middle" font-size="23" fill="#8f2f17" font-style="italic" font-weight="700">“It is real. Come and find it.”</text></g>
<g class="r" style="animation-delay:3.6s"><text class="" x="300" y="226" text-anchor="middle" font-size="17.5" fill="#3b2a1a" font-style="italic">And so dreamers everywhere set sail.</text></g>
<g class="r" style="animation-delay:3.6s"><text class="" x="300" y="248" text-anchor="middle" font-size="17.5" fill="#8f2f17" font-style="italic" font-weight="700">The Great Age of AI had begun!</text></g>
<g class="r" style="animation-delay:4.2s"><path d="M40 272 Q150 279 262 272 M338 272 Q450 265 560 272" fill="none" stroke="#1d1108" stroke-width="7" stroke-linecap="round"/>
<path d="M40 272 Q150 279 262 272 M338 272 Q450 265 560 272" fill="none" stroke="#d2ae6c" stroke-width="4.500" stroke-linecap="round"/>
<path class="twist" d="M40 272 Q150 279 262 272 M338 272 Q450 265 560 272" fill="none" stroke="#8a5a12" stroke-width="4.500" stroke-dasharray="2 8"/>
<g transform="translate(300 270) scale(.72)"><ellipse cx="0" cy="10" rx="44" ry="11" fill="#f2c14e" stroke="#8a5a12" stroke-width="1.5"/>
<path d="M-26 9 Q-24 -24 0 -24 Q24 -24 26 9 Q0 16 -26 9 Z" fill="#f7d06a" stroke="#8a5a12" stroke-width="1.5"/>
<path d="M-26 2 Q0 10 26 2 L26 9 Q0 16 -26 9 Z" fill="#e63946"/>
<path d="M-18 -12 q18 -6 36 0 M-22 -4 q22 -6 44 0" fill="none" stroke="#c9952c" stroke-width="1"/></g></g>
<text class="r" style="animation-delay:4.6s" x="300" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#8f2f17" letter-spacing="7">THE CAPTAIN</text>
<g class="r" style="animation-delay:5s"><text class="" x="300" y="328" text-anchor="middle" font-size="17.5" fill="#3b2a1a" >One of them was a <tspan font-weight="700" fill="#6b2a10">Physics Engineer</tspan> from Pereira,</text></g>
<g class="r" style="animation-delay:5s"><text class="" x="300" y="350" text-anchor="middle" font-size="17.5" fill="#3b2a1a" >Colombia, who learned to read the universe through</text></g>
<g class="r" style="animation-delay:5s"><text class="" x="300" y="372" text-anchor="middle" font-size="17.5" fill="#3b2a1a" >equations and now teaches machines how to think.</text></g>
<g class="r" style="animation-delay:5.6s"><text class="" x="300" y="402" text-anchor="middle" font-size="17.5" fill="#3b2a1a" >She sails as a <tspan font-weight="700" fill="#6b2a10">Data &amp; AI Engineer</tspan> with the <tspan font-weight="700" fill="#6b2a10">R&amp;D&amp;I</tspan></text></g>
<g class="r" style="animation-delay:5.6s"><text class="" x="300" y="424" text-anchor="middle" font-size="17.5" fill="#3b2a1a" ><tspan font-weight="700" fill="#6b2a10">crew of Integra S.A.</tspan>: building software, charting data</text></g>
<g class="r" style="animation-delay:5.6s"><text class="" x="300" y="446" text-anchor="middle" font-size="17.5" fill="#3b2a1a" >architectures and bringing AI aboard.</text></g>
<g class="r" style="animation-delay:6.2s"><text class="" x="300" y="480" text-anchor="middle" font-size="18" fill="#8f2f17" font-weight="700">Her dream: let machines do the repetitive work,</text></g>
<g class="r" style="animation-delay:6.2s"><text class="" x="300" y="502" text-anchor="middle" font-size="18" fill="#8f2f17" font-weight="700">so people can do the creative work.</text></g>
<g class="r" style="animation-delay:6.8s"><text x="528" y="534" text-anchor="end" font-size="15.500" font-style="italic" font-weight="700" fill="#8f2f17">— Captain Sonia Restrepo, “the Data Navigator”</text></g>
<g class="quill"><path d="M548 536 L566 498 Q582 480 577 510 Q572 526 552 534 Z" fill="#fffaf0" stroke="#1d1108" stroke-width="1.5"/>
<path d="M548 536 L573 493 M560 516 l9 -3 M564 508 l9 -4" fill="none" stroke="#1d1108" stroke-width="1.1"/></g>
<circle class="halo" cx="40" cy="494" r="30" fill="#ffd23f"/>
<rect x="31" y="508" width="18" height="30" rx="2.500" fill="#fffaf0" stroke="#1d1108" stroke-width="1.5"/>
<path d="M24 538 h32 l-4 7 h-24 Z" fill="#f2c14e" stroke="#1d1108" stroke-width="1.5"/>
<path d="M40 508 v-6" stroke="#1d1108" stroke-width="1.6"/>
<g class="flame"><path d="M40 500 q-8 -11 0 -23 q8 12 0 23 Z" fill="#ff9f1c" stroke="#1d1108" stroke-width="1.2"/><path d="M40 498 q-4 -6 0 -12 q4 6 0 12 Z" fill="#ffd23f"/></g>
</svg>
