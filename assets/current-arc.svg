<linearGradient id="juice" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e63946"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#6ab04c"/></linearGradient>
