<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d33"/><stop offset="1" stop-color="#12355b"/>
    </linearGradient>
    <linearGradient id="juice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e63946"/><stop offset="0.5" stop-color="#f4c430"/><stop offset="1" stop-color="#57d68d"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="260" rx="14"/></clipPath>
    <clipPath id="cell"><rect x="219" y="50" width="122" height="22" rx="3"/></clipPath>
    <style>
      text{font-family:Georgia,'Times New Roman',serif}
      .mono{font-family:Consolas,'Courier New',monospace}
      .fill{animation:ch 6s ease-in-out infinite}
      @keyframes ch{0%{transform:translateX(-112px)}80%,92%{transform:translateX(0)}100%{transform:translateX(-112px)}}
      .bolt{animation:bz 1.2s steps(2) infinite}
      .b2{animation-delay:.4s}.b3{animation-delay:.8s}
      @keyframes bz{0%{opacity:1}50%{opacity:.15}100%{opacity:1}}
      .flow{stroke-dasharray:6 8;animation:fw .8s linear infinite}
      @keyframes fw{to{stroke-dashoffset:-14}}
      .bus{animation:idle 1.2s ease-in-out infinite}
      @keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
      .flag{animation:fg 1.4s ease-in-out infinite;transform-origin:372px 78px}
      @keyframes fg{0%,100%{transform:skewY(-7deg)}50%{transform:skewY(7deg)}}
      .w{animation:wv 8s linear infinite}
      @keyframes wv{to{transform:translateX(-200px)}}
      .front{stroke-dasharray:330;stroke-dashoffset:330;animation:dr 6s ease-out infinite}
      @keyframes dr{0%,20%{stroke-dashoffset:330}60%,100%{stroke-dashoffset:0}}
      .p{transform-box:fill-box;transform-origin:center;animation:pp 6s ease-out infinite}
      @keyframes pp{0%{transform:scale(0)}6%{transform:scale(1.5)}10%,100%{transform:scale(1)}}
      .q{transform-box:fill-box;transform-origin:center;animation:qq 6s ease-out infinite}
      @keyframes qq{0%,55%{transform:scale(0)}62%{transform:scale(1.6)}68%,100%{transform:scale(1)}}
      .led{animation:bz 1s steps(2) infinite}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect x="1" y="1" width="1198" height="258" rx="14" fill="none" stroke="#f4c430" stroke-opacity=".35" stroke-width="2"/>

    <!-- dock + sea -->
    <g class="w"><path d="M0 226 q50 -10 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V260 H0 Z" fill="#1b6ca8" opacity=".55"/></g>
    <path d="M30 206 H430 v14 H30 Z" fill="#5a3a1e" stroke="#2b1a0c" stroke-width="1.5"/>
    <path d="M60 220 v30 M160 220 v30 M260 220 v30 M360 220 v30" stroke="#3b2511" stroke-width="8"/>
    <path d="M30 213 H430" stroke="#7a5230" stroke-width="1"/>

    <!-- charging station -->
    <rect x="62" y="112" width="46" height="94" rx="6" fill="#1d3f6e" stroke="#f4c430" stroke-width="2"/>
    <rect x="70" y="122" width="30" height="22" rx="3" fill="#0b1d33"/>
    <path class="bolt" d="M88 124 l-8 11 h6 l-3 8 l9 -12 h-6 Z" fill="#f4c430"/>
    <circle class="led" cx="76" cy="156" r="3" fill="#57d68d"/><circle cx="86" cy="156" r="3" fill="#f4c430"/><circle cx="96" cy="156" r="3" fill="#e63946" opacity=".4"/>
    <path d="M108 170 C140 200 150 150 176 164" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <path class="flow" d="M108 170 C140 200 150 150 176 164" fill="none" stroke="#f4c430" stroke-width="2" stroke-linecap="round"/>

    <!-- battery above the bus -->
    <rect x="215" y="46" width="130" height="30" rx="6" fill="#0b1d33" stroke="#f1dfb5" stroke-width="2.5"/>
    <rect x="345" y="54" width="7" height="14" rx="2" fill="#f1dfb5"/>
    <g clip-path="url(#cell)"><rect class="fill" x="219" y="50" width="122" height="22" fill="url(#juice)"/></g>
    <path d="M250 50 v22 M280 50 v22 M310 50 v22" stroke="#0b1d33" stroke-width="2"/>
    <path class="bolt b2" d="M200 52 l-9 12 h7 l-4 10 l11 -14 h-7 Z" fill="#f4c430"/>
    <path class="bolt b3" d="M372 34 l-7 9 h5 l-3 8 l9 -11 h-5 Z" fill="#f4c430"/>

    <!-- the electric bus -->
    <g class="bus">
      <path d="M372 104 V78" stroke="#3b2a1a" stroke-width="2.5"/>
      <g class="flag"><path d="M373 78 h24 q-4 6 0 13 h-24 Z" fill="#111"/><circle cx="385" cy="84" r="3" fill="#fff"/></g>
      <rect x="170" y="100" width="240" height="88" rx="16" fill="#f1dfb5" stroke="#3b2a1a" stroke-width="2.5"/>
      <path d="M171 158 H409 v14 q0 16 -16 16 H186 q-15 0 -15 -16 Z" fill="#c0392b"/>
      <path d="M171 158 H409" stroke="#3b2a1a" stroke-width="1.5"/>
      <rect x="184" y="114" width="36" height="32" rx="5" fill="#8fd3f4" stroke="#3b2a1a" stroke-width="1.5"/>
      <rect x="228" y="114" width="36" height="32" rx="5" fill="#8fd3f4" stroke="#3b2a1a" stroke-width="1.5"/>
      <rect x="272" y="114" width="36" height="32" rx="5" fill="#8fd3f4" stroke="#3b2a1a" stroke-width="1.5"/>
      <rect x="316" y="114" width="36" height="32" rx="5" fill="#8fd3f4" stroke="#3b2a1a" stroke-width="1.5"/>
      <path d="M362 114 h30 q8 0 8 10 v22 h-38 Z" fill="#8fd3f4" stroke="#3b2a1a" stroke-width="1.5"/>
      <path d="M190 140 l14 -20 M234 140 l14 -20 M278 140 l14 -20 M322 140 l14 -20 M368 140 l14 -20" stroke="#fff" stroke-width="3" opacity=".5"/>
      <text x="290" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#fff8e1" letter-spacing="4">MEGABÚS</text>
      <circle cx="404" cy="170" r="4" fill="#f4c430"/>
      <rect x="166" y="158" width="10" height="14" rx="2" fill="#111"/>
    </g>
    <circle cx="222" cy="192" r="15" fill="#1c1c1c" stroke="#3b2a1a" stroke-width="2"/><circle cx="222" cy="192" r="6" fill="#9fb3c8"/>
    <circle cx="358" cy="192" r="15" fill="#1c1c1c" stroke="#3b2a1a" stroke-width="2"/><circle cx="358" cy="192" r="6" fill="#9fb3c8"/>

    <!-- title -->
    <text x="470" y="72" font-size="14" font-weight="700" fill="#f4c430" letter-spacing="6">CURRENT ARC</text>
    <text x="468" y="122" font-size="46" font-weight="700" fill="#fff8e1">Megabús Island</text>
    <text class="mono" x="470" y="152" font-size="16" fill="#f1dfb5">optimizing electric-bus charging with AI</text>
    <g class="mono" font-size="13" fill="#0b1d33" font-weight="700" text-anchor="middle">
      <rect x="470" y="172" width="130" height="26" rx="13" fill="#f4c430"/><text x="535" y="190">NSGA-II + PSO</text>
      <rect x="610" y="172" width="136" height="26" rx="13" fill="#f4a261"/><text x="678" y="190">ML forecasting</text>
      <rect x="756" y="172" width="124" height="26" rx="13" fill="#8fd3f4"/><text x="818" y="190">real-time IoT</text>
    </g>

    <!-- Pareto front -->
    <g>
      <text x="1045" y="44" text-anchor="middle" font-size="13" font-style="italic" fill="#f1dfb5">hunting the Pareto front</text>
      <path d="M950 56 V196 H1160" fill="none" stroke="#9fb3c8" stroke-width="2" stroke-linecap="round"/>
      <path d="M945 62 l5 -8 l5 8 M1154 191 l8 5 l-8 5" fill="none" stroke="#9fb3c8" stroke-width="2" stroke-linecap="round"/>
      <text x="1056" y="216" text-anchor="middle" font-size="12" fill="#9fb3c8" letter-spacing="2">ENERGY COST</text>
      <text x="936" y="126" text-anchor="middle" font-size="12" fill="#9fb3c8" letter-spacing="2" transform="rotate(-90 936 126)">BATTERY WEAR</text>
      <g fill="#5d7ea3">
        <circle class="p" cx="1040" cy="92" r="4" style="animation-delay:.1s"/><circle class="p" cx="1090" cy="80" r="4" style="animation-delay:.3s"/>
        <circle class="p" cx="1120" cy="118" r="4" style="animation-delay:.5s"/><circle class="p" cx="1068" cy="124" r="4" style="animation-delay:.7s"/>
        <circle class="p" cx="1010" cy="118" r="4" style="animation-delay:.9s"/><circle class="p" cx="1130" cy="150" r="4" style="animation-delay:1.1s"/>
        <circle class="p" cx="1092" cy="150" r="4" style="animation-delay:1.3s"/><circle class="p" cx="1140" cy="90" r="4" style="animation-delay:1.5s"/>
        <circle class="p" cx="1050" cy="150" r="4" style="animation-delay:1.7s"/><circle class="p" cx="996" cy="86" r="4" style="animation-delay:1.9s"/>
      </g>
      <path class="front" d="M966 72 C972 130 1010 170 1150 180" fill="none" stroke="#f4c430" stroke-width="3" stroke-linecap="round"/>
      <g fill="#e63946" stroke="#fff8e1" stroke-width="1.5">
        <circle class="q" cx="968" cy="84" r="5"/><circle class="q" cx="982" cy="124" r="5" style="animation-delay:.15s"/>
        <circle class="q" cx="1010" cy="152" r="5" style="animation-delay:.3s"/><circle class="q" cx="1056" cy="169" r="5" style="animation-delay:.45s"/>
        <circle class="q" cx="1110" cy="177" r="5" style="animation-delay:.6s"/>
      </g>
    </g>
  </g>
</svg>
