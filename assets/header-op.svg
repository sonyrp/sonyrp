<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d33"/>
      <stop offset="0.45" stop-color="#1d3f6e"/>
      <stop offset="0.72" stop-color="#c8553d"/>
      <stop offset="0.86" stop-color="#f4a261"/>
      <stop offset="1" stop-color="#f9c784"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.6" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a261"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff8e1"/>
      <stop offset="0.5" stop-color="#f4c430"/>
      <stop offset="1" stop-color="#fff8e1"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="14"/></clipPath>
    <style>
      .s{fill:#fff;animation:tw 3s ease-in-out infinite}
      .s2{animation-delay:1s}.s3{animation-delay:2s}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
      .w1{animation:wv 7s linear infinite}
      .w2{animation:wv 11s linear infinite reverse}
      .w3{animation:wv 16s linear infinite}
      @keyframes wv{to{transform:translateX(-200px)}}
      .ship{animation:bob 5s ease-in-out infinite;transform-origin:960px 262px}
      @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
      .flag{animation:fl 1.6s ease-in-out infinite;transform-origin:0 -150px}
      @keyframes fl{0%,100%{transform:skewY(-6deg)}50%{transform:skewY(7deg)}}
      .rose{animation:rs 40s linear infinite;transform-origin:150px 120px}
      @keyframes rs{to{transform:rotate(360deg)}}
      .gull{animation:gl 26s linear infinite}
      .gull2{animation:gl 34s linear -12s infinite}
      @keyframes gl{from{transform:translateX(-80px)}to{transform:translateX(1300px)}}
      .fade{animation:fi 1.6s ease-out both}
      .fade2{animation:fi 1.6s ease-out .6s both}
      .fade3{animation:fi 1.6s ease-out 1.1s both}
      @keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      .hat{animation:ht 4s ease-in-out infinite;transform-origin:306px 104px}
      @keyframes ht{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(-9deg)}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#sky)"/>

    <!-- stars -->
    <g>
      <circle class="s" cx="60" cy="30" r="1.5"/><circle class="s s2" cx="210" cy="52" r="1.2"/>
      <circle class="s s3" cx="330" cy="24" r="1.6"/><circle class="s" cx="470" cy="46" r="1.1"/>
      <circle class="s s2" cx="590" cy="20" r="1.4"/><circle class="s s3" cx="700" cy="50" r="1"/>
      <circle class="s" cx="800" cy="26" r="1.5"/><circle class="s s2" cx="1100" cy="36" r="1.5"/>
      <circle class="s s3" cx="1160" cy="80" r="1.1"/><circle class="s" cx="30" cy="100" r="1"/>
      <circle class="s s2" cx="270" cy="110" r="1"/><circle class="s s3" cx="1050" cy="100" r="1.2"/>
    </g>

    <!-- sun on the horizon -->
    <circle cx="960" cy="250" r="170" fill="url(#glow)"/>
    <circle cx="960" cy="250" r="72" fill="url(#sun)"/>

    <!-- seagulls -->
    <g class="gull" fill="none" stroke="#0b1d33" stroke-width="2" stroke-linecap="round">
      <path d="M0 90 q8 -9 16 0 q8 -9 16 0"/>
      <path d="M40 108 q6 -7 12 0 q6 -7 12 0"/>
    </g>
    <g class="gull2" fill="none" stroke="#0b1d33" stroke-width="1.6" stroke-linecap="round" opacity=".7">
      <path d="M0 150 q6 -7 12 0 q6 -7 12 0"/>
    </g>

    <!-- compass rose -->
    <g class="rose" opacity=".75">
      <circle cx="150" cy="120" r="46" fill="none" stroke="#f4c430" stroke-width="1.5"/>
      <circle cx="150" cy="120" r="38" fill="none" stroke="#f4c430" stroke-width=".8" stroke-dasharray="2 5"/>
      <path d="M150 66 L158 112 L150 120 L142 112 Z" fill="#e63946"/>
      <path d="M150 174 L158 128 L150 120 L142 128 Z" fill="#f1dfb5"/>
      <path d="M96 120 L142 112 L150 120 L142 128 Z" fill="#f1dfb5"/>
      <path d="M204 120 L158 112 L150 120 L158 128 Z" fill="#f1dfb5"/>
      <path d="M118 88 L146 114 L150 120 L144 116 Z M182 88 L154 114 L150 120 L156 116 Z M118 152 L146 126 L150 120 L144 124 Z M182 152 L154 126 L150 120 L156 124 Z" fill="#f4c430"/>
      <circle cx="150" cy="120" r="4" fill="#0b1d33" stroke="#f4c430"/>
    </g>

    <!-- far waves -->
    <g class="w3"><path d="M0 252 q50 -10 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V340 H0 Z" fill="#1b6ca8"/></g>

    <!-- ship -->
    <g class="ship">
      <g transform="translate(960 262)">
        <!-- masts -->
        <rect x="-3" y="-150" width="5" height="126" fill="#3b2a1a"/>
        <rect x="-50" y="-108" width="4" height="84" fill="#3b2a1a"/>
        <path d="M70 -34 L104 -52" stroke="#3b2a1a" stroke-width="4" stroke-linecap="round"/>
        <!-- jolly roger -->
        <g class="flag">
          <path d="M2 -150 h34 q-5 8 0 18 h-34 Z" fill="#111"/>
          <circle cx="18" cy="-140" r="4.2" fill="#fff"/>
          <path d="M11 -143 q7 -7 14 0 Z" fill="#f2c14e"/>
          <path d="M9 -143 h18" stroke="#f2c14e" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M11 -135 l14 -4 M11 -139 l14 4" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
        </g>
        <!-- sails -->
        <path d="M-38 -126 Q0 -116 38 -126 L44 -62 Q0 -46 -44 -62 Z" fill="#fbf1d3" stroke="#3b2a1a" stroke-width="1.5"/>
        <path d="M-30 -110 Q0 -102 30 -110 M-34 -92 Q0 -82 34 -92 M-38 -76 Q0 -64 38 -76" fill="none" stroke="#e63946" stroke-width="3" opacity=".8"/>
        <path d="M-72 -96 Q-48 -90 -26 -96 L-22 -52 Q-48 -42 -76 -52 Z" fill="#fbf1d3" stroke="#3b2a1a" stroke-width="1.5"/>
        <path d="M70 -36 L4 -112 L4 -40 Z" fill="#fbf1d3" stroke="#3b2a1a" stroke-width="1.5" opacity=".92"/>
        <!-- hull -->
        <path d="M-84 -34 L80 -34 Q70 0 46 6 L-52 6 Q-74 0 -84 -34 Z" fill="#5a3a1e" stroke="#2b1a0c" stroke-width="1.5"/>
        <path d="M-80 -24 L76 -24" stroke="#f4c430" stroke-width="2.5"/>
        <circle cx="-40" cy="-12" r="3" fill="#f9c784"/><circle cx="-12" cy="-12" r="3" fill="#f9c784"/><circle cx="16" cy="-12" r="3" fill="#f9c784"/><circle cx="44" cy="-12" r="3" fill="#f9c784"/>
      </g>
    </g>

    <!-- near waves -->
    <g class="w2"><path d="M0 272 q50 -14 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V340 H0 Z" fill="#12507f"/></g>
    <g class="w1"><path d="M0 298 q50 -16 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V340 H0 Z" fill="#0b2f52"/></g>
    <g class="w1" opacity=".5"><path d="M0 300 q50 -16 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0" fill="none" stroke="#a8dadc" stroke-width="1.5"/></g>

    <!-- title -->
    <text class="fade3" x="560" y="50" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#f9c784" letter-spacing="4">— SETTING SAIL ON THE GRAND LINE OF DATA —</text>
    <text class="fade" x="560" y="158" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" fill="url(#gold)" stroke="#0b1d33" stroke-width="1.2" paint-order="stroke">Sonia Restrepo</text>
    <text class="fade2" x="560" y="204" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#fff8e1" letter-spacing="2">DATA &amp; AI ENGINEER  ✦  PHYSICS ENGINEER  ✦  R&amp;D&amp;I</text>

    <!-- straw hat resting on the name -->
    <g class="fade">
      <g transform="translate(-62 6)"><g class="hat" style="transform-origin:368px 98px">
        <ellipse cx="368" cy="100" rx="44" ry="11" fill="#f2c14e" stroke="#8a5a12" stroke-width="1.5"/>
        <path d="M342 99 Q344 66 368 66 Q392 66 394 99 Q368 106 342 99 Z" fill="#f7d06a" stroke="#8a5a12" stroke-width="1.5"/>
        <path d="M342 92 Q368 100 394 92 L394 99 Q368 106 342 99 Z" fill="#e63946"/>
        <path d="M350 78 q18 -6 36 0 M346 86 q22 -6 44 0" fill="none" stroke="#c9952c" stroke-width="1"/>
      </g></g>
    </g>
  </g>
</svg>
