name: Contribution voyage

on:
  schedule:
    - cron: "0 5 * * *"   # every day
  workflow_dispatch:      # allows manual runs
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Chart the contribution sea
        run: python3 scripts/contribution_voyage.py "${{ github.repository_owner }}" dist/contribution-voyage.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
