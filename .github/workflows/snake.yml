name: Contribution snake

on:
  schedule:
    - cron: "0 5 * * *"   # every day
  workflow_dispatch:      # allows manual runs
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#c0392b&color_dots=#ebedf0,#a8dadc,#457b9d,#f4a261,#f4c430
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e63946&color_dots=#161b22,#12355b,#1b6ca8,#f4a261,#f4c430

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
